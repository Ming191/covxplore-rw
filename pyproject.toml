[project]
name = "covxplore"
version = "0.2.0"
description = "MC/DC coverage-driven test generation agent for C/C++"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm]",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
covxplore-gen = "covxplore.main:run_generation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covxplore"]

[tool.crewai]
type = "crew"
